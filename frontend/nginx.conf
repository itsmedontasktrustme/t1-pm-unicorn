server {
    listen 80;
    server_name t1-pm-unicorn.cloud;
    return 301 https://$host$request_uri;

}

server {
    listen 443 ssl;
    server_name nemo.team1.com;

    ssl_certificate     /etc/letsencrypt/live/t1-pm-unicorn.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t1-pm-unicorn.cloud/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:81/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}