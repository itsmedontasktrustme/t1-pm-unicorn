services:
  backend:
    build:
      args:
      - NODE_ENV=development
      context: backend
      target: development
    command: npm run start-watch
    environment:
      - DATABASE_DB=homekeeper
      - DATABASE_USER=root
      - DATABASE_PASSWORD=/run/secrets/db-password
      - DATABASE_HOST=db
      - NODE_ENV=development
      - PORT=81
    ports:
      - "81:81"
      - "9229:9229"
      - "9230:9230"
    secrets:
      - db-password
    volumes:
      - ./backend/src:/code/src:ro
      - ./backend/package.json:/code/package.json
      - ./backend/package-lock.json:/code/package-lock.json
      - back-notused:/opt/app/node_modules
    networks:
      - public
      - private
    depends_on:
      - db
  db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    command:
      - /bin/bash
      - -c
      - |
        set -e
        /usr/local/bin/docker-entrypoint.sh mysqld &
        mysql_pid=$!
        until mysqladmin ping -h 127.0.0.1 -u root --password="$$(cat /run/secrets/db-password)" --silent; do
          sleep 1
        done
        /usr/local/bin/run-migrations.sh
        if [ -n "$${mysql_pid:-}" ] && kill -0 "$${mysql_pid}" 2>/dev/null; then
          wait "$${mysql_pid}"
        fi
    restart: always
    secrets:
      - db-password
    volumes:
      - ./db/schema:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-entrypoint-startdb.d:ro
      - ./db/migrations/run-migrations.sh:/usr/local/bin/run-migrations.sh:ro
      - db-data:/var/lib/mysql
    networks:
      - private
    environment:
      - MYSQL_DATABASE=homekeeper
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
  frontend:
    build:
      context: frontend
      target: development
    command: sh -c 'export REACT_APP_CLERK_PUBLISHABLE_KEY="$(printenv VITE_CLERK_PUBLISHABLE_KEY)" && npm start'
    env_file:
      - ./frontend/.env.local
    environment:
      - PORT=80
      - REACT_APP_BACKEND_URL=http://backend:81
      - REACT_APP_HISTORY_API_URL=/api/history/action
    ports:
      - "80:80"
    volumes:
      - ./frontend/src:/code/src
      - /code/node_modules
    networks:
      - public
    depends_on:
      - backend
networks:
  public:
  private:
volumes:
  back-notused:
  db-data:
secrets:
  db-password:
    file: db/password.txt
