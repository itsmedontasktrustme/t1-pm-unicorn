services:
  backend:
    build:
      context: backend
      args:
        - NODE_ENV=production
    environment:
      - DATABASE_DB=homekeeper
      - DATABASE_USER=root
      - DATABASE_PASSWORD=/run/secrets/db-password
      - DATABASE_HOST=db
      - NODE_ENV=production
      - PORT=81
      # Google sign-in through Clerk: the backend verifies the session token (JWT).
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_JWT_KEY=${CLERK_JWT_KEY:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-https://t1-pm-unicorn.cloud}
    ports:
      - "81:81"
    secrets:
      - db-password
    networks:
      - public
      - private
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:10.6.4-focal
    # image: mysql:8.0.27   # uncomment if you prefer MySQL
    command:
      - /bin/bash
      - -c
      - |
        set -e
        /usr/local/bin/docker-entrypoint.sh mysqld &
        mysql_pid=$!
        until mysqladmin ping -h 127.0.0.1 -u root --password="$$(cat /run/secrets/db-password)" --silent; do
          sleep 1
        done
        /usr/local/bin/run-migrations.sh
        if [ -n "$${mysql_pid:-}" ] && kill -0 "$${mysql_pid}" 2>/dev/null; then
          wait "$${mysql_pid}"
        fi
    restart: unless-stopped
    secrets:
      - db-password
    volumes:
      - ./db/schema:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-entrypoint-startdb.d:ro
      - ./db/migrations/run-migrations.sh:/usr/local/bin/run-migrations.sh:ro
      - db-data:/var/lib/mysql
    networks:
      - private
    environment:
      - MYSQL_DATABASE=homekeeper
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password

  frontend:
    build:
      context: frontend
      # Uses the final nginx stage by default
      args:
        - REACT_APP_CLERK_PUBLISHABLE_KEY=${REACT_APP_CLERK_PUBLISHABLE_KEY}
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORT=81
      - REACT_APP_BACKEND_URL=http://t1-pm-unicorn.cloud:81
      - REACT_APP_HISTORY_API_URL=/api/history/action
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - public
    depends_on:
      - backend
    restart: unless-stopped

networks:
  public:
  private:

volumes:
  db-data:

secrets:
  db-password:
    file: db/password.txt