services:
  backend:
    build:
      context: backend
      args:
        - NODE_ENV=production
    environment:
      - DATABASE_DB=example
      - DATABASE_USER=root
      - DATABASE_PASSWORD=/run/secrets/db-password
      - DATABASE_HOST=db
      - NODE_ENV=production
    secrets:
      - db-password
    networks:
      - public
      - private
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:10.6.4-focal
    # image: mysql:8.0.27   # uncomment if you prefer MySQL
    command: '--default-authentication-plugin=mysql_native_password'
    restart: unless-stopped
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - private
    environment:
      - MYSQL_DATABASE=example
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password

  frontend:
    build:
      context: frontend
      # Uses the final nginx stage by default
      args:
        - REACT_APP_CLERK_PUBLISHABLE_KEY=${REACT_APP_CLERK_PUBLISHABLE_KEY}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - public
    depends_on:
      - backend
    restart: unless-stopped

networks:
  public:
  private:

volumes:
  db-data:

secrets:
  db-password:
    file: db/password.txt